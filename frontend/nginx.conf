server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # CSV/XLSX uploads go through here to the backend. nginx default body limit
    # is 1MB, which would reject larger trade files with 413. Bump it.
    client_max_body_size 25m;

    # Security headers applied to every response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip text assets. JS/CSS/JSON compress well; images/fonts already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css application/javascript application/json
        application/xml image/svg+xml;

    # proxy API calls to backend. dashboard/bot-analytics is matched in full so
    # the SPA page route /dashboard still falls through to index.html below.
    location ~ ^/(trades|symbols|health|dashboard/bot-analytics) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache fingerprinted build assets aggressively (Vite hashes filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — never cache index.html so new deploys are picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
