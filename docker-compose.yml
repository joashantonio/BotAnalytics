services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Internal-only: reachable by the frontend (nginx proxy_pass http://backend:8000)
    # but NOT published to the host. To debug from the VM host, temporarily add
    # a `ports: ["8000:8000"]` block.
    expose:
      - "8000"
    environment:
      # DevOps: set to the real public origin(s) of the frontend, comma-separated.
      # e.g. https://trades.sindbad.tech  — wrong/missing value -> browser CORS block.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DB_PATH=/data/trade_handler.db
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    volumes:
      - trade_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

volumes:
  trade_data:
